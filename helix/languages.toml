[language-server.intelephense]
command = "intelephense"
args = ["--stdio"]

[language-server.laravel-lsp]
command = "laravel-lsp"

[language-server.rust-analyzer]
command = "rust-analyzer"

[[language]]
name = "php"
roots = ["composer.json", "artisan", ".git"]
language-servers = ["intelephense", "laravel-lsp"]

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language-server.typescript-language-server.config.plugins]]
name = "@vue/typescript-plugin"
location = "/home/simaocurado/.local/share/mise/installs/node/latest/lib/node_modules/@vue/typescript-plugin"
languages = ["vue"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server"]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server"]

[[language]]
name = "vue"
language-servers = ["typescript-language-server"]
formatter = { command = "prettier", args = ["--parser", "vue"] }
